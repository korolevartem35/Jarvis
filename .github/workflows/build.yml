name: Build JARVIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake \
            libffi-dev libssl-dev automake build-essential libtool-bin

      - name: Downgrade libtool to 2.4.6
        run: |
          # libtool 2.4.7 сломал совместимость с libffi 3.4.2
          cd /tmp
          wget -q http://ftpmirror.gnu.org/libtool/libtool-2.4.6.tar.gz
          tar xzf libtool-2.4.6.tar.gz
          cd libtool-2.4.6
          ./configure --prefix=/usr/local
          make -j4
          sudo make install
          sudo ldconfig
          /usr/local/bin/libtool --version

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install "cython<3.0" buildozer

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build.log

      - name: Show tail of log if failed
        if: failure()
        run: |
          echo "===== Последние 120 строк лога ====="
          tail -n 120 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
          retention-days: 30
