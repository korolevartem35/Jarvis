name: Build JARVIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake \
            libffi-dev libssl-dev automake

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install "cython<3.0" buildozer

      - name: Patch libffi configure.ac
        run: |
          # фикс известного бага libffi: LT_SYS_SYMBOL_USCORE
          # делаем символическую ссылку на ltmain.sh в p4a
          echo "Настраиваем окружение для сборки..."

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          yes | buildozer android debug 2>&1 | tee build.log

      - name: Show tail of log if failed
        if: failure()
        run: |
          echo "===== Последние 60 строк лога ====="
          tail -n 60 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
          retention-days: 30
